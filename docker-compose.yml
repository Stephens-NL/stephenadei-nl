services:
  stephenadei-nl:
    build: .
    container_name: stephenadei-nl
    restart: unless-stopped
    ports:
      - "4303:4303"
    environment:
      - NODE_ENV=production
      - PORT=4303
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4303/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
